apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: postgres-payments-staging-db-payments
  title: db-payments (payments-staging)
  description: Postgres database payments-staging_db-payments on the shared server, provisioned by Crossplane
  annotations:
    # crossplane.io/composite=<name> is only unique within a namespace, so
    # the tenant label narrows it down. Not backstage.io/kubernetes-namespace:
    # a namespaced lookup also queries cluster-scoped kinds such as Tenant
    # and reports NOT_FOUND errors in the Kubernetes tab.
    backstage.io/kubernetes-label-selector: crossplane.io/composite=db-payments,idplatformkit.io/tenant=payments-staging
  links:
    - url: https://github.com/idpk-test/instances/blob/main/databases/payments-staging/db-payments.yaml
      title: PostgresDatabase claim
spec:
  type: database
  owner: group:default/team-a
  dependencyOf:
    - resource:default/tenant-payments
